@if (isloading()) {
  <loading-page-component />
}

<div
  class="relative flex min-h-screen flex-col text-base-content bg-gradient-to-br from-sky-50 via-white to-violet-100"
>
  <div
    class="pointer-events-none absolute top-0 left-0 w-96 h-96 bg-sky-300/20 blur-3xl rounded-full"
  ></div>
  <div
    class="pointer-events-none absolute bottom-0 right-0 w-96 h-96 bg-violet-300/20 blur-3xl rounded-full"
  ></div>

  <header class="bg-white/70 border-base-content/10 sticky top-0 z-50 border-b backdrop-blur-md">
    <navbar-component />
  </header>

  <main id="main-content" class="mx-auto w-full max-w-6xl flex-1 px-4 py-8 md:py-10 relative z-10">
    <router-outlet />
  </main>

  <footer-component />
</div>
