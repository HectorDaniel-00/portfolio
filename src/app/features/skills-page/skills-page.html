<section
  class="relative px-4 py-12 md:py-16 bg-gradient-to-br from-white via-sky-50 to-violet-100 rounded-box overflow-hidden"
>
  <!-- decoraciones -->
  <div class="absolute top-0 left-0 w-72 h-72 bg-sky-300/20 blur-3xl rounded-full"></div>
  <div class="absolute bottom-0 right-0 w-72 h-72 bg-violet-300/20 blur-3xl rounded-full"></div>

  <!-- HEADER -->
  <div class="max-w-5xl mx-auto mb-10 text-center md:text-left animate-fade-in">
    <span
      class="inline-block px-4 py-1 text-sm font-semibold text-sky-600 bg-sky-100 rounded-full mb-3"
    >
      Habilidades
    </span>

    <h1 class="text-3xl md:text-4xl font-extrabold">Skills & Tecnologías</h1>

    <p class="text-base-content/70 mt-3 max-w-2xl mx-auto md:mx-0">
      Tecnologías y herramientas que utilizo para diseñar, construir y escalar aplicaciones
      modernas.
    </p>
  </div>

  <!-- GRID -->
  <grid-skills-componet [skillGroups]="skillGroups" />
</section>
